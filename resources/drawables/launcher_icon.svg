<svg viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">
  <!-- Beer mug, matching the colours BeerCaloriesView draws with:
       amber #FFAA00 liquid, #F5EEDC foam, #804000 shading. No background
       rect, so it sits on whatever the launcher menu uses. Detail is kept
       coarse because this is rendered as small as 26x26. -->

  <!-- handle -->
  <path d="M47 28 q13 1 13 8 t-13 8"
        fill="none" stroke="#D0D0D0" stroke-width="4" stroke-linecap="round"/>

  <!-- amber liquid, drawn first so the glass outline overlaps it cleanly -->
  <path d="M20 24 L46 24 L43 56 q0 3 -3 3 L26 59 q-3 0 -3 -3 Z"
        fill="#FFAA00"/>

  <!-- bubbles -->
  <circle cx="29" cy="44" r="2.2" fill="#804000" opacity="0.55"/>
  <circle cx="37" cy="37" r="1.8" fill="#804000" opacity="0.55"/>

  <!-- foam head, overhanging the rim -->
  <path d="M17 22 q-1 -6 5 -6 q1 -5 7 -3 q3 -4 8 -1 q5 -2 7 3 q6 0 5 7 Z"
        fill="#F5EEDC"/>
  <!-- separator so foam reads apart from the liquid at small sizes -->
  <path d="M18 22 L48 22" stroke="#804000" stroke-width="2" stroke-linecap="round"/>

  <!-- glass outline -->
  <path d="M17 17 L47 17 L43 56 q0 3 -3 3 L26 59 q-3 0 -3 -3 Z"
        fill="none" stroke="#E8E8E8" stroke-width="3" stroke-linejoin="round"/>
</svg>
